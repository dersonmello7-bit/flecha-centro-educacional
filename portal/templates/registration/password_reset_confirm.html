{% extends 'base.html' %}{% block content %}<section class="login-card">{% if validlink %}<h1>Defina sua senha.</h1><p>Escolha uma senha exclusiva com pelo menos 12 caracteres.</p><form method="post">{% csrf_token %}{{form.as_p}}<button>Salvar nova senha</button></form>{% else %}<h1>Link indisponível.</h1><p>Este link expirou ou já foi utilizado.</p><a href="{% url 'password_reset' %}">Solicitar outro link</a>{% endif %}</section>{% endblock %}
